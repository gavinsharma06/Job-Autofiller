<div data-automation-id="applyFlowMyInfoPage">
  <label for="country-btn">Country/Region*</label>
  <button id="country-btn" type="button" aria-haspopup="listbox" data-automation-id="countryDropdown"
    data-options='["United States of America","Canada","India"]'>Select One</button>
  <label for="fn">First Name*</label><input id="fn" data-automation-id="legalNameSection_firstName">
  <label for="ln">Last Name*</label><input id="ln" data-automation-id="legalNameSection_lastName">
  <label for="a1">Address Line 1*</label><input id="a1" data-automation-id="addressSection_addressLine1">
  <label for="city">City*</label><input id="city" data-automation-id="addressSection_city">
  <label for="prov">Province*</label>
  <button id="prov" type="button" aria-haspopup="listbox" data-automation-id="addressSection_countryRegion"
    data-options='["Alberta","Nova Scotia","Ontario"]'>Select One</button>
  <label for="pc">Postal Code*</label><input id="pc" data-automation-id="addressSection_postalCode">
  <label for="pcc">Country Phone Code*</label>
  <button id="pcc" type="button" aria-haspopup="listbox"
    data-options='["Canada (+1)","United States of America (+1)","India (+91)"]'>Select One</button>
  <label for="ph">Phone Number*</label><input id="ph" data-automation-id="phone-number">
</div>

<div data-automation-id="workExperience-1">
  <label for="jt1">Job Title*</label><input id="jt1" data-automation-id="jobTitle">
  <label for="co1">Company*</label><input id="co1" data-automation-id="company">
  <label for="lo1">Location</label><input id="lo1" data-automation-id="location">
  <label for="cw1">I currently work here</label><input id="cw1" type="checkbox" data-automation-id="currentlyWorkHere">
  <div data-automation-id="formField-startDate">
    <label>From*</label>
    <input id="sm1" data-automation-id="dateSectionMonth-input" placeholder="MM">
    <input id="sy1" data-automation-id="dateSectionYear-input" placeholder="YYYY">
  </div>
  <div data-automation-id="formField-endDate">
    <label>To</label>
    <input id="em1" data-automation-id="dateSectionMonth-input" placeholder="MM">
    <input id="ey1" data-automation-id="dateSectionYear-input" placeholder="YYYY">
  </div>
  <label for="rd1">Role Description</label><textarea id="rd1" data-automation-id="description"></textarea>
</div>

<div data-automation-id="workExperience-2">
  <label for="jt2">Job Title*</label><input id="jt2" data-automation-id="jobTitle">
  <label for="co2">Company*</label><input id="co2" data-automation-id="company">
  <label for="rd2">Role Description</label><textarea id="rd2" data-automation-id="description"></textarea>
  <div data-automation-id="formField-startDate">
    <label>From*</label>
    <input id="sm2" data-automation-id="dateSectionMonth-input" placeholder="MM">
    <input id="sy2" data-automation-id="dateSectionYear-input" placeholder="YYYY">
  </div>
</div>

<div data-automation-id="education-1">
  <label for="sc1">School or University*</label><input id="sc1" data-automation-id="school">
  <label for="dg1">Degree*</label>
  <button id="dg1" type="button" aria-haspopup="listbox"
    data-options='["High School","Bachelor&#39;s Degree","Master&#39;s Degree"]'>Select One</button>
  <label for="gp1">Overall Result (GPA)</label><input id="gp1" data-automation-id="gpa">
  <div data-automation-id="formField-firstYear">
    <label>From</label><input id="fy1" data-automation-id="dateSectionYear-input">
  </div>
  <div data-automation-id="formField-lastYear">
    <label>To (Actual or Expected)</label><input id="ly1" data-automation-id="dateSectionYear-input">
  </div>
</div>
