<form id="app">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text">
  <label for="last_name">Last Name *</label><input id="last_name" type="text">
  <label for="email">Email *</label><input id="email" type="email">
  <label for="phone">Phone</label><input id="phone" type="tel">
  <label>LinkedIn Profile <input type="url" name="linkedin"></label>
  <label for="country">Country</label>
  <select id="country">
    <option value="">Select...</option>
    <option value="CA">Canada</option>
    <option value="US">United States</option>
  </select>
  <fieldset>
    <legend>Are you legally authorized to work in Canada?</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <label for="why">Why do you want to work here?</label><textarea id="why"></textarea>
  <label for="salary">Salary expectations</label><input id="salary" type="text">
  <label for="gender">Gender</label>
  <select id="gender"><option value="">Select</option><option>Female</option><option>Male</option></select>
  <label for="cv">Resume</label><input id="cv" type="file">
  <label><input type="checkbox" id="terms"> I agree to the privacy policy</label>
  <input type="password" id="pw">
  <input type="hidden" name="csrf" value="token">
  <div style="display:none"><label for="secret">First name</label><input id="secret"></div>
  <input type="submit" id="submit" value="Submit application">
</form>
